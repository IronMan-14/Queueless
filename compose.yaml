name: queueless
services:
  db:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: queueless
      MYSQL_USER: queueless
      MYSQL_PASSWORD: ${QUEUELESS_DB_PASSWORD:?Set QUEUELESS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    environment:
      QUEUELESS_DB_URL: jdbc:mysql://db:3306/queueless?connectionTimeZone=UTC
      QUEUELESS_DB_USER: queueless
      QUEUELESS_DB_PASSWORD: ${QUEUELESS_DB_PASSWORD:?Set QUEUELESS_DB_PASSWORD in .env}
      QUEUELESS_MIGRATE: "false"
      QUEUELESS_PUBLIC_ORIGIN: ${QUEUELESS_PUBLIC_ORIGIN:-http://localhost:8080}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
