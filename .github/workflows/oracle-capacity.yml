name: Oracle capacity retry

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect only, or attempt the reviewed deployment
        type: choice
        options: [inspect, attempt]
        default: inspect

permissions:
  contents: read

concurrency:
  group: oracle-capacity-retry
  cancel-in-progress: false

jobs:
  retry:
    if: github.event_name == 'workflow_dispatch' || vars.OCI_CAPACITY_RETRY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    env:
      OCI_STACK_ID: ocid1.ormstack.oc1.ap-hyderabad-1.amaaaaaaxmeeerqacgjkhiaqnzx5jqnvfopsa5ruhpvrpnn6527bfs65soga
      OCI_REGION: ap-hyderabad-1
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_APPROVED_STACK_DIGEST: ${{ vars.OCI_APPROVED_STACK_DIGEST }}
      RETRY_MODE: ${{ inputs.mode || 'attempt' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_oracle_capacity_retry.py
      - run: python -m pip install --disable-pip-version-check oci==2.189.0
      - run: python scripts/oracle_capacity_retry.py
